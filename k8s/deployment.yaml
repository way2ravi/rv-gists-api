
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rv-gists-api
  labels:
    app: rv-gists-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rv-gists-api
  template:
    metadata:
      labels:
        app: rv-gists-api
    spec:
      containers:
        - name: rv-gists-api
          image: ghcr.io/way2ravi/rv-gists-api:sha-101ce898b2a98a035622f308f367ca16490d89cf
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi