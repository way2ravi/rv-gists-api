
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rv-gists-api
  labels:
    app: rv-gists-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rv-gists-api
  template:
    metadata:
      labels:
        app: rv-gists-api
    spec:
      containers:
        - name: rv-gists-api
          image: ghcr.io/way2ravi/rv-gists-api:sha-89b1935d7e7ea74fb9799108cf7ce9cc0e4d0fc2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi